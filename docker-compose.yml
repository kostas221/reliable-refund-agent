# Local PostgreSQL for development and tests. The passwords are local test values, not secrets.
# The image is pinned by digest after the first pull, so it never changes silently (plan section 5).
services:
  db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336  # 18.6
    # Back up whenever Docker starts (after a reboot, say), unless stopped on purpose: a stopped database made whole
    # test runs end in connection timeouts on 2026-10-15 and 2026-10-16.
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    # Reachable from this computer only: the passwords are known test values (review of 2026-10-19, R11).
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The demo application: the screens and the API on http://localhost:8000, in mock mode (no API key, no cost).
  # Started only with its profile, so `docker compose up -d` (tests, CI) still starts the database alone:
  #   docker compose --profile app up --build
  # Another development scenario: docker compose --profile app run --rm --service-ports app --scenario D05
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      REFUND_DB_HOST: db
      REFUND_DB_PORT: "5432"
    # Reachable from this computer only, like the database: the demo users share a known password.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
