# Demo refund policy of the fictional shop. Not Olist's policy and not legal advice.
#
# This file is the single controlled source of the policy. The backend reads the rules from it, and
# docs/refund-policy.md is rendered from it with `uv run python -m refund_agent.policy`.
#
# Section texts must not contain digits: every number comes from [rules] through a {placeholder}, so a
# value cannot be changed in one place and forgotten in another. Loading the policy checks this, checks
# that every placeholder names a rule, and that every rule appears in some section text. These checks are
# structural: whether a sentence states its rule correctly is checked by the behaviour tests of
# refund_agent/eligibility.py and by reading.
#
# A released version is frozen by its content hash (FROZEN_VERSIONS in refund_agent/policy.py). Any change
# to a rule or a text needs a new version.

policy_id = "refund-policy"
version = "v1"
currency = "BRL"

[rules]
# Order statuses that can receive a refund (Olist order_status values).
eligible_order_statuses = ["delivered"]
# The refund must be requested (the proposal created) at most this many days of 24 hours after delivery.
refund_window_days = 30
# A proposal can be acted on only strictly before this many hours after its creation.
proposal_ttl_hours = 72

[[sections]]
id = "scope"
title = "What this policy covers"
text = """
This policy covers refunds for items in orders that the signed-in customer placed with the demo shop.
All amounts are in {currency}, and all times are the shop's clock in UTC. The shop and this policy are
fictional: this is a demonstration, not the policy of any real shop and not legal advice.
"""

[[sections]]
id = "eligible-orders"
title = "Which orders qualify"
text = """
Only orders with the status {eligible_order_statuses} can receive a refund. An order that has not been
delivered is not refunded through this process; if the customer reports a delivery that never arrived, a
staff member takes the case. If a delivered order has no delivery time, or one that cannot be right (before
the purchase or in the future), a staff member takes the case.
"""

[[sections]]
id = "window"
title = "Time limit"
text = """
A refund must be requested no later than {refund_window_days} days after the delivery time recorded on the
order. Days are exact periods of twenty-four hours, and a request at exactly the deadline is on time. The
request time is the moment the shop creates the refund proposal. If an earlier proposal for the same items
was created in time but expired or stopped being valid before it was paid, a later request is not refused
for being late: a staff member takes the case.
"""

[[sections]]
id = "return"
title = "Items must be returned first"
text = """
The shop refunds only units it has received back, as shown by its own return records, never by a statement
of the customer or the assistant. If the records show the units arrived, the request continues normally.
If they do not, the shop pays nothing for those units; if the customer says the units were already sent, a
staff member checks.
"""

[[sections]]
id = "amount"
title = "Refund amount"
text = """
The refund for a unit is what was paid for that unit: its price minus its share of any discount. The
shares are fixed once, when the order is recorded, and never recalculated: when a paid total is split among
identical units, each unit gets the total divided by the number of units, rounded down to the smallest unit
of the currency, and what is left over is added one smallest unit at a time to the last units, so no unit
is refunded more than its price. Shipping charges are not part of the amount.
"""

[[sections]]
id = "remaining"
title = "Each unit is refunded once"
text = """
Each unit is refunded at most once, in full. A unit that was already refunded cannot be refunded again. A
request for more units than are left is not paid; the assistant can offer the units that remain.
"""

[[sections]]
id = "shipping"
title = "Shipping charges"
text = """
Shipping charges are never refunded automatically. If the customer asks for shipping to be refunded, a
staff member takes the case.
"""

[[sections]]
id = "payment"
title = "Where the money goes"
text = """
A refund is paid automatically only when the order has exactly one payment record and that record is valid
(a known payment method and a positive amount), and only to that payment. Instalments of one payment are one payment record.
In every other case a staff member takes the case. A refund can never be sent to another person, account
or card.
"""

[[sections]]
id = "approval"
title = "Confirmation and approval"
text = """
Every refund needs two separate decisions: the customer confirms the exact proposal (items, quantities and
amount) with the button on the proposal card, and a staff member approves it. Changing anything in a
proposal needs a new proposal, a new confirmation and a new approval. A staff member cannot approve a refund
that this policy does not allow.
"""

[[sections]]
id = "validity"
title = "How long a proposal is valid"
text = """
A proposal can be confirmed, approved or paid only strictly before it expires, {proposal_ttl_hours} hours
after it is created. After that it expires together with its confirmation and approval, and a new proposal
is needed. A proposal also stops being valid if the order or this policy changes before it is paid. Expiry
stops new payments only: a refund already paid stays paid, and its receipt can always be retrieved.
"""

[[sections]]
id = "payout"
title = "When the money is paid"
text = """
The shop pays a refund only when all of these hold: the order qualifies, the request was on time, the units
were received back and not refunded before, the order has one valid payment, the customer confirmed, a
staff member approved, and the proposal is still valid. The refund is complete only when the customer has a
receipt; until then nothing is reported as refunded.
"""

[[sections]]
id = "exceptions"
title = "Exceptions and talking to a person"
text = """
Anything this policy does not cover, and any request for an exception, goes to a staff member. The customer
can ask for a person at any time.
"""
