[project]
name = "reliable-refund-agent"
version = "0.0.1"
description = "A customer-support agent that proposes refunds, obtains customer confirmation and staff approval, and executes each authorized operation at most once"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
