[project]
name = "reliable-refund-agent"
version = "0.0.1"
description = "A customer-support agent that proposes refunds, obtains customer confirmation and staff approval, and executes each authorized operation at most once"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
