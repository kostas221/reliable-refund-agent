# frozen and unchanged.
# Two orders each hold a pair of pruning shears, both sent back; only one is meant: the agent has to ask which order.
# Olist orders (data/olist/subset.json), two garden_tools items, each of its own order and seller:
# 57ac42b13ab9e5c23733ab0911b2e7dd, 119.99 + freight 34.20, one card payment of 154.19 in 2 instalments;
# accc70091bea9b16050ec5a5a61823a7, 59.90 + freight 13.44, one card payment of 73.34 in 2 instalments.
id = "D17"
title = "Similar items in two orders; only one is meant"
