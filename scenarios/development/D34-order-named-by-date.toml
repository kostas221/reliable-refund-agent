[customer]
id = "d34-rita"
goal = "Get a refund for the planter from your 5 October order only."
opening_message = "Hello, I sent back the white ceramic planter from the order I placed on 5 October. Can I get my money back?"
facts = [
    { text = "You also returned the planter from your first order, but the seller is replacing it, so you do not want a refund for it.", reveal = "when_asked" },
]
behaviour = [
    "Confirm a refund proposal for the planter from the 5 October order only.",
]
confirms = { units = ["d34-o2-u1"], amount_minor = 4590 }

[staff]
decision = "approve"

[[policy_checks]]
units = ["d34-o2-u1"]
decision = "eligible"
amount_minor = 4590

[[policy_checks]]
units = ["d34-o1-u1"]
decision = "eligible"
amount_minor = 4590

[expected]
refunded_units = ["d34-o2-u1"]
refund_amount_minor = 4590
last_proposal_status = ["refunded"]
handoff = "forbidden"
communication = ["proposes_without_asking", "states_correct_amount", "gives_this_receipt"]
