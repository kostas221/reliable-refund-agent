# Contrasting development case (plan change log, 2026-10-22), written before any run of it.
# Pair 2 with D33: the same two orders. The customer names the order by the date it was placed, so the agent proposes without asking.
id = "D34"
title = "The customer names the order by its date"
split = "development"
category = "eligible"
template = "order-named-by-date"
policy_version = "v2"
now = 2026-10-20T10:00:00Z
agent_visible_orders = ["d34-o1", "d34-o2"]

[[fixture.customers]]
id = "d34-rita"
name = "Rita Almeida"
