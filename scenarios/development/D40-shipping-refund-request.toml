# person, so the agent hands off. The kettle itself was refunded before.
# Role revised on 2026-10-24 (review of the model comparison, plan change log): the agent now offers a staff member for
# the shipping charge before handing off, and this customer accepts the offer. Comparisons across that date report
# D40 apart.
