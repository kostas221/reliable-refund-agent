# The order was paid with a card and a voucher, two payment records: the policy sends the refund to a person, who
# decides how the money goes back. Sent to a person because of the payments, not lateness (D10).
# Olist order 498964d3c3eddfc0d670e6be2ea2d5b2 (data/olist/subset.json): one health_beauty item, 64.99 + freight
# 13.02, paid 28.01 by card and 50.00 by voucher.
id = "H19"
title = "Paid with a card and a voucher"
split = "held_out"
category = "clarification_handoff"
template = "two-payment-records"
policy_version = "v1"
now = 2026-10-21T10:00:00Z  # delivered 6 Oct 14:48:43, so the deadline is 5 Nov 14:48:43
agent_visible_orders = ["h19-o1"]

[[fixture.customers]]
id = "h19-aline"
name = "Aline Moreira"
email = "aline.moreira@example.test"

[[fixture.staff]]
id = "h19-rui"
name = "Rui Costa"
email = "rui.costa@shop.example.test"

[[fixture.orders]]
id = "h19-o1"
customer = "h19-aline"
status = "delivered"
purchased_at = 2026-09-16T11:35:55Z
delivered_at = 2026-10-06T14:48:43Z
payments = [
    { method = "credit_card", amount_minor = 2801 },
    { method = "voucher", amount_minor = 5000 },
]  # 2801 + 5000 = 6499 + shipping 1302
olist_order = "498964d3c3eddfc0d670e6be2ea2d5b2"

[[fixture.orders.units]]
id = "h19-o1-u1"
